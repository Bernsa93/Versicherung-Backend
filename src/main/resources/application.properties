# Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=InsuranceDB;encrypt=true;trustServerCertificate=${OPENAI_TRUST_SERVER_CERTIFICATE:true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Passwort123!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql=off

# OpenAI API Configuration
openai.api.key=${OPENAopenI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1}
openai.timeout=${OPENAI_TIMEOUT:30000}
openai.max.tokens=${OPENAI_MAX_TOKENS:2000}

# Logging
logging.level.de.beispiel.versicherung.service.OpenAiService=DEBUG